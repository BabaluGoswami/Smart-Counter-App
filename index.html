<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Counter App | Your Name</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <div class="counter-box">

            <h1>Smart Counter App</h1>
            <p class="subtitle">Built with HTML, CSS & JavaScript</p>

            <h2 id="count">0</h2>

            <div class="buttons">
                <button class="plus" onclick="increase()">Increase</button>
                <button class="minus" onclick="decrease()">Decrease</button>
                <button class="reset" onclick="resetCounter()">Reset</button>
            </div>

        </div>

        <footer>
            <p style="color: black;">Developed by <strong>Babalu Goswami</strong> © 2026</p>
        </footer>

    </div>

    <script src="app.js"></script>

</body>

</html>
